# 推送代码后在 GitHub 的 macOS runner 上编译，并把可下载的客户端发布到 Releases
#
# 下载入口（给普通用户）：
#   - 手动触发本工作流 → 更新 Releases 里的 `latest`（预发布）→ 下载 zip/dmg
#   - 打 v* tag     → 生成正式 Release（自动附上 zip/dmg）
#
# 说明：
# - 只在 main 分支和 v* tag 上跑，避免每个功能分支都消耗额度
# - public 仓库的 GitHub 托管 runner 免费；macOS runner 单次约 5–15 分钟
# - 产物**未做签名/公证**：用户首次打开需要「右键 → 打开」，或
#   `xattr -d com.apple.quarantine "/Applications/IPTV Mac.app"`
#   要免这一步，需要 Apple Developer 账号并在 secrets 里配置签名证书（见文末注释）
name: build-macos

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装依赖
        run: npm ci

      # tauri.conf.json 把 binaries/ffmpeg 声明为打包资源，而它体积大、被 .gitignore 排除。
      # 不先取回来，tauri-build 会直接报 "resource path `binaries/ffmpeg` doesn't exist"。
      - name: 获取内置 ffmpeg
        run: bash scripts/fetch-ffmpeg.sh

      - name: 类型检查与前端测试
        run: npm run typecheck && npm test

      - name: Rust 测试（单线程）
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1

      - name: 打包 .app（必需）
        run: npx tauri build --bundles app

      # 没有 Apple 开发者账号：至少做 ad-hoc 签名，保证包内签名自洽（Apple Silicon 上也更不容易被拦）
      - name: ad-hoc 签名（无开发者账号）
        continue-on-error: true
        run: |
          codesign --force --deep --sign - --timestamp=none "src-tauri/target/release/bundle/macos/IPTV Mac.app" || true
          codesign --verify --deep --verbose=1 "src-tauri/target/release/bundle/macos/IPTV Mac.app" || true

      # ⚠️ 顺序很重要：Tauri 的 DMG 打包会把 bundle/macos 下的 .app 清掉（塞进 DMG 后清场），
      # 所以必须先压缩好 .app，再去打 DMG。
      - name: 压缩客户端（zip 便于直接下载解压）
        run: |
          cd "src-tauri/target/release/bundle/macos"
          ditto -c -k --sequesterRsrc --keepParent "IPTV Mac.app" "IPTV-Mac-macos-arm64.zip"
          ls -lh

      # DMG 是加分项：runner 上 hdiutil 正常，失败也不影响已压好的 zip
      - name: 尝试打包 .dmg（可选）
        continue-on-error: true
        run: npx tauri build --bundles dmg

      - name: 上传 zip（必需）
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Mac-macos
          path: src-tauri/target/release/bundle/macos/IPTV-Mac-macos-arm64.zip
          if-no-files-found: error

      - name: 上传 dmg（可选）
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Mac-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

  # 把 zip 发布到 Releases，普通用户可直接下载
  # - 推 main → 更新滚动预发布 `latest`（用户装到的永远是最新构建）
  # - 打 v* tag → 生成正式 Release
  # - 手动触发 → 同样更新 `latest`
  publish:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: IPTV-Mac-macos
          path: dist

      - name: 下载可选 dmg（没有就跳过）
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: IPTV-Mac-dmg
          path: dist

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          # tag 推送 → 用 tag 名发正式版；手动触发 → 更新滚动预发布 `latest`
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'IPTV Mac（最新构建）' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: |
            dist/IPTV-Mac-macos-arm64.zip
            dist/**/*.dmg
          body: |
            ## 一键安装（推荐）

            ```bash
            curl -fsSL https://raw.githubusercontent.com/seldoms/iptv-mac/main/scripts/install-macos.sh | bash
            ```

            指定版本：在结尾加 `| bash -s -- --tag v1.0.2`；滚动最新：`| bash -s pre`。

            macOS 客户端（Apple Silicon / arm64），构建自 `${{ github.sha }}`。
            ```bash
            curl -fsSL https://raw.githubusercontent.com/seldoms/iptv-mac/main/scripts/install-macos.sh | bash
            ```

            ## 手动安装

            下载 zip → 解压得到 `IPTV Mac.app` → 拖进「应用程序」；
            首次打开请**右键 → 打开**（本构建未做 Apple 签名/公证，开发者账号暂无）；
            若仍被拦，执行一次：
            ```bash
            xattr -d com.apple.quarantine "/Applications/IPTV Mac.app"
            ```

            从源码构建与开发环境部署（可直接复制给 AI Agent 的提示词）见
            [docs/SETUP_PROMPT.md](https://github.com/seldoms/iptv-mac/blob/main/docs/SETUP_PROMPT.md)。

# 想做成"下载即可打开"的正规分发，需要：
#   1. Apple Developer Program 账号，导出 Developer ID Application 证书（.p12）
#   2. 仓库 Secrets 增加：APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD /
#      APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#   3. 在打包步骤前导入证书，Tauri 会自动完成签名 + 公证
