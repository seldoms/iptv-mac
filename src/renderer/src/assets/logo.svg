<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="IPTV Mac">
  <!-- 与应用图标同一套设计：黑色圆角底 + 黄色电视机 + 播放三角 -->
  <rect width="512" height="512" rx="112" fill="#000000"/>
  <g stroke="#FFD400" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- 天线 -->
    <path d="M256 180 L203 118"/>
    <path d="M256 180 L309 118"/>
    <!-- 机身 -->
    <rect x="112" y="180" width="288" height="196" rx="56"/>
  </g>
  <!-- 播放三角 -->
  <path d="M224 230 L224 322 L302 276 Z" fill="#FFD400"/>
  <!-- 右侧两颗旋钮 -->
  <circle cx="366" cy="248" r="13" fill="#FFD400"/>
  <circle cx="366" cy="298" r="13" fill="#FFD400"/>
</svg>
