<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- TV Outer Frame Gradient -->
    <linearGradient id="tvFrameGrad" x1="80" y1="100" x2="432" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="40%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- TV Body Gradient -->
    <linearGradient id="tvBodyGrad" x1="88" y1="110" x2="424" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Screen Bezel -->
    <linearGradient id="screenBezel" x1="106" y1="134" x2="354" y2="366" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Screen Glow Background -->
    <radialGradient id="screenGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#0369A1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#082F49" stop-opacity="0.05"/>
    </radialGradient>

    <!-- Cat Fur Gradient (Main) -->
    <linearGradient id="catFur" x1="230" y1="130" x2="230" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="40%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Cat Muzzle & Belly (White) -->
    <linearGradient id="catWhite" x1="230" y1="210" x2="230" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Eye Gradient -->
    <linearGradient id="eyeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="45%" stop-color="#059669"/>
      <stop offset="85%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Ear Inner Pink -->
    <linearGradient id="earInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Knob Gradient -->
    <linearGradient id="knobGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Ambient Glow Left -->
    <radialGradient id="cyanAmbient" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Glow Right -->
    <radialGradient id="amberAmbient" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter for TV -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Cat Soft Pop Shadow -->
    <filter id="catShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#030712" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="116" fill="url(#cyanAmbient)"/>
  <rect width="512" height="512" rx="116" fill="url(#amberAmbient)"/>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>

  <!-- Background Decorative Stars -->
  <path d="M96 90 L98 98 L106 100 L98 102 L96 110 L94 102 L86 100 L94 98 Z" fill="#38BDF8" opacity="0.6"/>
  <path d="M420 84 L422 92 L430 94 L422 96 L420 104 L418 96 L410 94 L418 92 Z" fill="#FBBF24" opacity="0.6"/>
  <circle cx="120" cy="420" r="3" fill="#38BDF8" opacity="0.4"/>
  <circle cx="395" cy="415" r="3.5" fill="#FBBF24" opacity="0.4"/>

  <!-- TV Antennas -->
  <g stroke-linecap="round">
    <!-- Antenna Base -->
    <path d="M232 118 C232 112 268 112 268 118" stroke="#64748B" stroke-width="6" fill="#334155"/>
    <!-- Left Antenna -->
    <line x1="240" y1="115" x2="168" y2="44" stroke="#94A3B8" stroke-width="8"/>
    <circle cx="168" cy="44" r="11" fill="#38BDF8"/>
    <circle cx="168" cy="44" r="5" fill="#E0F2FE"/>
    <!-- Right Antenna -->
    <line x1="260" y1="115" x2="332" y2="44" stroke="#94A3B8" stroke-width="8"/>
    <circle cx="332" cy="44" r="11" fill="#FBBF24"/>
    <circle cx="332" cy="44" r="5" fill="#FEF3C7"/>
  </g>

  <!-- TV Stand Legs -->
  <path d="M142 390 L126 438" stroke="#D97706" stroke-width="16" stroke-linecap="round"/>
  <path d="M142 390 L135 410" stroke="#F59E0B" stroke-width="12" stroke-linecap="round"/>
  <circle cx="125" cy="438" r="4" fill="#78350F"/>

  <path d="M358 390 L374 438" stroke="#D97706" stroke-width="16" stroke-linecap="round"/>
  <path d="M358 390 L365 410" stroke="#F59E0B" stroke-width="12" stroke-linecap="round"/>
  <circle cx="375" cy="438" r="4" fill="#78350F"/>

  <!-- TV Body with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Outer TV Bezel (Warm Retro Border) -->
    <rect x="76" y="110" width="348" height="284" rx="46" fill="url(#tvFrameGrad)"/>
    <!-- TV Inner Case -->
    <rect x="84" y="118" width="332" height="268" rx="38" fill="url(#tvBodyGrad)"/>
    <rect x="84" y="118" width="332" height="268" rx="38" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>
  </g>

  <!-- TV Right Control Panel Area -->
  <g>
    <!-- Upper Knob -->
    <circle cx="376" cy="178" r="20" fill="url(#knobGrad)" stroke="#64748B" stroke-width="3"/>
    <circle cx="376" cy="178" r="14" fill="#0F172A"/>
    <line x1="376" y1="167" x2="376" y2="173" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Lower Knob -->
    <circle cx="376" cy="236" r="20" fill="url(#knobGrad)" stroke="#64748B" stroke-width="3"/>
    <circle cx="376" cy="236" r="14" fill="#0F172A"/>
    <line x1="384" y1="230" x2="379" y2="234" stroke="#FBBF24" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Speaker Grille -->
    <line x1="360" y1="288" x2="392" y2="288" stroke="#334155" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="360" y1="302" x2="392" y2="302" stroke="#334155" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="360" y1="316" x2="392" y2="316" stroke="#334155" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="360" y1="330" x2="392" y2="330" stroke="#334155" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Power Indicator LED (Glowing Green) -->
    <circle cx="376" cy="358" r="5" fill="#10B981"/>
    <circle cx="376" cy="358" r="8" fill="#10B981" opacity="0.3"/>
  </g>

  <!-- TV Screen Outer Frame -->
  <rect x="104" y="136" width="236" height="232" rx="32" fill="url(#screenBezel)"/>
  <!-- TV Screen Glass / Display -->
  <rect x="110" y="142" width="224" height="220" rx="26" fill="#090D16"/>
  <!-- Screen Glow -->
  <rect x="110" y="142" width="224" height="220" rx="26" fill="url(#screenGlow)"/>

  <!-- Screen Top-Right Reflection / Signal Icon -->
  <path d="M305 160 C315 160 322 167 322 177" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M305 167 C311 167 315 171 315 177" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <circle cx="305" cy="177" r="1.5" fill="#38BDF8" opacity="0.5"/>

  <!-- ==================== CAT CHARACTER ==================== -->
  <g id="catCharacter" filter="url(#catShadow)">
    <!-- Cat Body / Shoulders -->
    <path d="M150 348 C150 300 170 278 222 278 C274 278 294 300 294 348 Z" fill="url(#catFur)"/>
    <!-- Cat Chest (White) -->
    <path d="M182 348 C182 312 198 294 222 294 C246 294 262 312 262 348 Z" fill="url(#catWhite)"/>

    <!-- Cat Left Ear (Breaks out slightly above screen) -->
    <path d="M152 198 C140 162 144 116 164 102 C182 92 206 130 214 162 Z" fill="#64748B"/>
    <!-- Cat Left Ear Inner -->
    <path d="M158 186 C150 160 152 126 166 116 C178 110 194 138 200 162 Z" fill="url(#earInner)"/>

    <!-- Cat Right Ear -->
    <path d="M292 198 C304 162 300 116 280 102 C262 92 238 130 230 162 Z" fill="#64748B"/>
    <!-- Cat Right Ear Inner -->
    <path d="M286 186 C294 160 292 126 278 116 C266 110 250 138 244 162 Z" fill="url(#earInner)"/>

    <!-- Cat Head Shape (Cute chubby cheeks) -->
    <path d="M142 226 C136 264 168 294 222 294 C276 294 308 264 302 226 C298 190 280 164 222 164 C164 164 146 190 142 226 Z" fill="url(#catFur)"/>

    <!-- Forehead Tabby Stripes -->
    <path d="M222 170 V186" stroke="#334155" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M206 174 L212 188" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <path d="M238 174 L232 188" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

    <!-- Cat Face White Mask (Muzzle & Cheeks) -->
    <path d="M174 246 C168 274 186 292 222 292 C258 292 276 274 270 246 C266 226 248 220 222 220 C196 220 178 226 174 246 Z" fill="url(#catWhite)"/>

    <!-- Rosy Blush Cheeks -->
    <ellipse cx="168" cy="248" rx="14" ry="8" fill="#FDA4AF" opacity="0.75"/>
    <ellipse cx="276" cy="248" rx="14" ry="8" fill="#FDA4AF" opacity="0.75"/>

    <!-- Left Eye -->
    <g>
      <ellipse cx="186" cy="222" rx="15" ry="17" fill="#090D16"/>
      <ellipse cx="186" cy="224" rx="12" ry="14" fill="url(#eyeGrad)"/>
      <ellipse cx="186" cy="223" rx="8" ry="10" fill="#064E3B"/>
      <!-- Eye Highlights (Kawaii sparkles) -->
      <circle cx="182" cy="216" r="4.5" fill="#FFFFFF"/>
      <circle cx="190" cy="227" r="2.5" fill="#FFFFFF"/>
    </g>

    <!-- Right Eye -->
    <g>
      <ellipse cx="258" cy="222" rx="15" ry="17" fill="#090D16"/>
      <ellipse cx="258" cy="224" rx="12" ry="14" fill="url(#eyeGrad)"/>
      <ellipse cx="258" cy="223" rx="8" ry="10" fill="#064E3B"/>
      <!-- Eye Highlights (Kawaii sparkles) -->
      <circle cx="254" cy="216" r="4.5" fill="#FFFFFF"/>
      <circle cx="262" cy="227" r="2.5" fill="#FFFFFF"/>
    </g>

    <!-- Cute Pink Nose -->
    <path d="M217 238 C217 236 227 236 227 238 C227 241 223 244 222 244 C221 244 217 241 217 238 Z" fill="#FB7185"/>

    <!-- Cute :3 Smile Mouth -->
    <path d="M212 248 Q222 254 222 246 Q222 254 232 248" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

    <!-- Whiskers Left -->
    <line x1="162" y1="242" x2="132" y2="238" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="162" y1="250" x2="134" y2="254" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Whiskers Right -->
    <line x1="282" y1="242" x2="312" y2="238" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="282" y1="250" x2="310" y2="254" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Left Paw Poking Over TV Bottom Frame -->
    <g filter="url(#catShadow)">
      <rect x="156" y="336" width="34" height="24" rx="12" fill="#FFFFFF"/>
      <line x1="167" y1="344" x2="167" y2="354" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="178" y1="344" x2="178" y2="354" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Right Paw Poking Over TV Bottom Frame -->
    <g filter="url(#catShadow)">
      <rect x="254" y="336" width="34" height="24" rx="12" fill="#FFFFFF"/>
      <line x1="265" y1="344" x2="265" y2="354" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="276" y1="344" x2="276" y2="354" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- TV Glass Glare / Gloss highlight arc -->
  <path d="M120 152 C180 152 230 162 260 180" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.15"/>
</svg>