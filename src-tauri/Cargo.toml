[package]
name = "iptv-mac"
version = "1.0.1"
description = "macOS IPTV player"
authors = ["IPTV Mac contributors"]
edition = "2021"

[lib]
name = "iptv_mac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
dom_query = "0.27"
futures-util = "0.3"
parking_lot = "0.12"
regex = "1"
reqwest = { version = "0.12", features = ["json", "gzip"] }
rquickjs = { version = "0.12", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
url = "2"
urlencoding = "2"
flate2 = "1"
quick-xml = "0.36"
rand = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
